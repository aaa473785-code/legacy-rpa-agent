<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>顧客検索サンプル</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    input, button { font-size: 1rem; padding: .5rem; }
    table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .5rem; }
  </style>
</head>
<body>
  <h1>顧客検索サンプル</h1>
  <label>顧客名: <input id="keyword" type="text"></label>
  <button id="searchButton" onclick="search()">検索</button>
  <p id="count">検索結果: 0件</p>
  <table>
    <thead>
      <tr><th>顧客ID</th><th>顧客名</th><th>部署</th><th>注意点</th></tr>
    </thead>
    <tbody id="result"></tbody>
  </table>
<script>
function search() {
  const keyword = document.getElementById('keyword').value;
  const rows = [
    ['C001', '山田 太郎', '営業部', ''],
    ['C002', '山田 花子', '総務部', '要確認']
  ].filter(r => r[1].includes(keyword));

  document.getElementById('count').innerText = `検索結果: ${rows.length}件`;
  document.getElementById('result').innerHTML = rows.map(
    r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`
  ).join('');
}
</script>
</body>
</html>
